# Reusable CI test job: install the pinned toolchain, fail fast on i18n
# regressions, syntax-check every source file, then run the Vitest suite with
# the high-coverage gate (thresholds live in vitest.config.js). Called by
# ci.yml (pull requests + feature branches) and by deploy.yml as the gate that
# must pass before anything ships to production.
#
# Actions are pinned to commit SHAs (the tag in the comment is what Dependabot
# bumps): a moved tag can no longer run foreign code inside these jobs.
name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Pinned dev toolchain from package-lock.json; cache keyed on the lockfile.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pure bash + grep — no dependency on the install succeeding.
      - name: i18n audit
        run: bash scripts/i18n-audit.sh

      # Parse every src/*.js with `node --check` before running the suite.
      - name: Syntax-check sources
        run: npm run check

      # Vitest under jsdom. `npm run coverage` enforces the high coverage floor
      # configured in vitest.config.js (statements/functions/lines >= 99%,
      # branches >= 98%), so this step fails the build on a real regression.
      - name: Unit tests + coverage gate
        run: npm run coverage

      # Exercise the Pages Function inside workerd with a real local KV binding.
      # Direct jsdom unit tests remain useful for exhaustive validation branches;
      # this catches platform/runtime and binding integration mistakes.
      - name: Workers runtime integration tests
        run: npm run test:workers

  # Real-browser smoke test: boots the app in headless Chromium via
  # test-e2e/smoke.spec.mjs (plain Playwright library, no runner/config) and
  # asserts first paint, a title→gameZen→title round-trip, persistence, and
  # zero console/page errors — the class of failures jsdom can't see.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Chromium download (~150 MB) is keyed on the lockfile, which pins
      # the playwright version. On a hit only the apt system libraries are
      # (re)installed; on a miss the browser is downloaded as well.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e
