# Deploys dist/ to the Cloudflare Pages project "jeweled" on every push to
# master (and on manual dispatch). scripts/build.sh stamps the commit SHA into
# the service-worker cache key and the BUILD constant during the build step,
# using $GITHUB_SHA — no extra CI logic needed.
#
# Three jobs: `test` (the reusable gate in test.yml), `bundle` (build, bundle,
# syntax-check and smoke-test the production tree, then upload dist/ as an
# artifact) and `deploy` (the reusable lucasdaddiego/.github cloudflare-deploy
# workflow: it downloads that artifact and runs wrangler).
#
# Actions are pinned to commit SHAs (the tag in the comment is what Dependabot
# bumps): the deploy holds the Cloudflare token, so a moved tag must not be able
# to run foreign code here.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: install + i18n audit + syntax check + Vitest with the coverage floor
  # + workerd tests + the browser smoke test. Deploy only runs if this passes,
  # so a coverage/test regression blocks production. The audit is not repeated
  # below: the gate already ran it on this same commit.
  test:
    uses: ./.github/workflows/test.yml

  bundle:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Shallow clone — we only need the working tree, not history. Saves
      # ~1s on cold clones of larger repos.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Install the pinned dev toolchain (esbuild, html-minifier-terser,
      # wrangler) from package-lock.json. `npm ci` is reproducible — it installs
      # exactly the locked versions and fails if package.json and the lockfile
      # disagree — which fixes the old floating-version + static-cache-key setup.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (copy sources into dist/)
        run: bash scripts/build.sh

      # Bundle src/*.js into a single minified module, then minify CSS, HTML,
      # and the service worker. The bundler tree-shakes unreachable code and
      # mangles identifiers — that's our "light obfuscation". Heavier transforms
      # (control-flow flattening etc.) would tank frame rate on the Canvas loop.
      #
      # Order matters: build.sh has already stamped $GITHUB_SHA into
      # dist/src/build.js and dist/sw.js. The bundler reads the stamped build.js
      # via title.js's import, so BUILD survives into the bundle. sw.js is
      # minified afterwards but the cache key stamp from build.sh is preserved.
      - name: Bundle, minify, obfuscate
        run: |
          set -euo pipefail
          ESBUILD=node_modules/.bin/esbuild
          HTMLMIN=node_modules/.bin/html-minifier-terser
          # Fingerprinted bundle name: content-addressed by commit, so it can be
          # cached forever (immutable header appended to _headers below). This
          # also sidesteps zone-level cache rules that override no-cache on JS —
          # a stale copy of main.<sha>.js is by definition the right copy.
          SHA8="${GITHUB_SHA:0:8}"
          BUNDLE="main.${SHA8}.js"
          # The stylesheet gets the same treatment: the zone-level browser TTL
          # (4 h on .css) overrides the no-cache in _headers, so an unnamed
          # style.css kept returning visitors on the old CSS after a deploy.
          STYLE="style.${SHA8}.css"

          # Bundle the ES-module entrypoint. --format=esm preserves the
          # `<script type="module">` contract; --target=es2022 keeps the output
          # small while remaining safe on any browser shipping in the last 3y.
          "$ESBUILD" dist/src/main.js \
            --bundle \
            --minify \
            --format=esm \
            --target=es2022 \
            --legal-comments=none \
            --outfile="dist/${BUNDLE}"

          # The bundle now contains every reachable src/*.js, so the originals
          # no longer need to be published. Dropping them also prevents stale
          # un-minified copies from being served via direct URL.
          rm -rf dist/src

          # Point index.html (script src + modulepreload) at the bundle. GNU
          # sed (ubuntu) is fine with -i without a backup suffix.
          sed -i "s|/src/main.js|/${BUNDLE}|g" dist/index.html

          # Rewrite sw.js: drop every '/src/...' PRECACHE entry, add the bundle
          # once after '/favicon.svg', and repoint the MAIN_ENTRY core-asset
          # const. CACHEABLE_PREFIXES already includes '/main.' so the bundle
          # is runtime-cacheable under any fingerprint.
          sed -i "/^  '\/src\//d" dist/sw.js
          sed -i "s|'/favicon.svg',|'/favicon.svg',\n  '/${BUNDLE}',|" dist/sw.js
          sed -i "s|const MAIN_ENTRY = '/src/main.js';|const MAIN_ENTRY = '/${BUNDLE}';|" dist/sw.js

          # Rename the stylesheet and repoint index.html, the sw.js precache entry
          # (generated by build.sh before this step) and the STYLE_ENTRY core-asset
          # const, exactly like the bundle above.
          mv dist/style.css "dist/${STYLE}"
          sed -i "s|/style.css|/${STYLE}|g" dist/index.html
          sed -i "s|'/style.css',|'/${STYLE}',|" dist/sw.js
          sed -i "s|const STYLE_ENTRY = '/style.css';|const STYLE_ENTRY = '/${STYLE}';|" dist/sw.js

          # Immutable caching for the fingerprinted files (exact-path stanzas —
          # Pages _headers has no mid-path wildcard).
          printf '\n/%s\n  Cache-Control: public, max-age=31536000, immutable\n' "$BUNDLE" >> dist/_headers
          printf '\n/%s\n  Cache-Control: public, max-age=31536000, immutable\n' "$STYLE" >> dist/_headers

          # Assert the rewrites actually applied. These seds are coupled to the
          # source formatting (indent, trailing comma); if upstream changes break
          # a match, the sed silently no-ops and — because dist/src was just
          # rm -rf'd — index.html would 404 the whole app while CI stays green.
          # Fail loud instead. (Anchored '^[[:space:]]*'/src/' matches PRECACHE
          # entries only, not the const CACHEABLE_PREFIXES = ['/src/', ...] line.)
          grep -q "/${BUNDLE}" dist/index.html \
            || { echo "::error::index.html was not repointed to /${BUNDLE}"; exit 1; }
          ! grep -q '/src/main.js' dist/index.html \
            || { echo "::error::index.html still references the unbundled /src/main.js"; exit 1; }
          grep -q "'/${BUNDLE}'," dist/sw.js \
            || { echo "::error::sw.js precache is missing the /${BUNDLE} entry"; exit 1; }
          grep -q "const MAIN_ENTRY = '/${BUNDLE}';" dist/sw.js \
            || { echo "::error::sw.js MAIN_ENTRY was not repointed to the bundle"; exit 1; }
          ! grep -qE "^[[:space:]]*'/src/" dist/sw.js \
            || { echo "::error::sw.js still precaches /src/ paths after rewrite"; exit 1; }
          grep -q "/${BUNDLE}" dist/_headers \
            || { echo "::error::_headers is missing the immutable stanza for /${BUNDLE}"; exit 1; }
          grep -q "/${STYLE}" dist/index.html \
            || { echo "::error::index.html was not repointed to /${STYLE}"; exit 1; }
          ! grep -q '/style.css' dist/index.html \
            || { echo "::error::index.html still references the unfingerprinted /style.css"; exit 1; }
          grep -q "'/${STYLE}'," dist/sw.js \
            || { echo "::error::sw.js precache is missing the /${STYLE} entry"; exit 1; }
          grep -q "const STYLE_ENTRY = '/${STYLE}';" dist/sw.js \
            || { echo "::error::sw.js STYLE_ENTRY was not repointed to /${STYLE}"; exit 1; }
          ! grep -q "'/style.css'" dist/sw.js \
            || { echo "::error::sw.js still references the unfingerprinted /style.css"; exit 1; }
          grep -q "/${STYLE}" dist/_headers \
            || { echo "::error::_headers is missing the immutable stanza for /${STYLE}"; exit 1; }

          # Minify CSS and the service worker in place. --allow-overwrite lets
          # esbuild read and write the same path in one invocation.
          "$ESBUILD" "dist/${STYLE}" --minify --allow-overwrite --outfile="dist/${STYLE}"
          "$ESBUILD" dist/sw.js     --minify --allow-overwrite --outfile=dist/sw.js

          # Minify HTML. --minify-css/--minify-js handle any inline style/script
          # (currently none, but cheap insurance if that changes).
          "$HTMLMIN" \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --remove-redundant-attributes \
            -o dist/index.html dist/index.html

          echo "Post-bundle dist/ size: $(du -sh dist | cut -f1)"
          echo "Bundle size: $(du -h "dist/${BUNDLE}" | cut -f1)"

      # Parse every JS file in dist/ with `node --check`. Catches syntax
      # errors that would otherwise ship to prod and leave the app stuck on
      # the boot splash (e.g. duplicate `const`, missing brace, stray comma).
      # Runs *after* bundling so the minified output is what gets validated.
      # Parallelized via xargs -P so a handful of files finish in ~0.2s.
      - name: Syntax-check JS bundle
        run: |
          set -euo pipefail
          find dist -type f -name '*.js' -print0 \
            | xargs -0 -P "$(nproc)" -I{} sh -c \
                'node --check "{}" 2>&1 || { echo "::error file={}::syntax error"; exit 255; }'
          echo "Syntax OK across $(find dist -type f -name '*.js' | wc -l) files"

      # Boot the bundled tree in a real browser before anything ships. The
      # gate's smoke job exercised the ES-module sources; only this run sees
      # the single-file bundle, the minified sw.js and the fingerprinted
      # stylesheet. A module that works as separate files but throws once
      # hoisted into one scope (an import-cycle TDZ) passes `node --check` and
      # used to reach production as a boot splash that never went away.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke-test the production bundle
        run: node test-e2e/smoke.spec.mjs

      # The deploy job runs on another runner: hand it the finished dist/.
      - name: Upload dist/ for the deploy job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # The deploy itself (checkout, Node, the artifact download, wrangler) is the
  # reusable lucasdaddiego/.github cloudflare-deploy workflow. @main on purpose:
  # my own public repo, and the actions are SHA-pinned there. Nothing to install
  # or build here: dist/ is the artifact from `bundle`. --commit-dirty=true
  # silences the "uncommitted changes" warning the downloaded dist/ would
  # otherwise trigger.
  deploy:
    needs: bundle
    uses: lucasdaddiego/.github/.github/workflows/cloudflare-deploy.yml@main
    with:
      install: ""
      artifact: dist
      artifact-path: dist
      wrangler-command: pages deploy dist --project-name=jeweled --branch=master --commit-dirty=true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is a repo secret here, so it travels under `secrets:` (not available in `with:`).
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
